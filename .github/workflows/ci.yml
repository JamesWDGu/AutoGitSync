name: CI

# Unit tests and static checks: runs on PRs and pushes to main/release.
# Building and publishing the image is handled by docker.yml.
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # 3.12 is the version used inside the image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tests bring their own fixture (a local bare repository as remote): no
      # dependencies to install and no network needed
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check the environment based configuration
        run: |
          set -uo pipefail

          python app/main.py --version

          # a missing GIT_REPO must exit with code 2, not with a traceback
          set +e
          python app/main.py --check
          code=$?
          set -e
          [ "$code" = 2 ] || { echo "::error::a missing GIT_REPO must fail with exit code 2, got $code"; exit 1; }

          # with a complete environment --check must succeed
          mkdir -p /tmp/ags-src
          printf 'a=1\n' > /tmp/ags-src/a.conf
          GIT_REPO=/tmp/remote.git \
          SOURCE_DIR=/tmp/ags-src \
          REPO_DIR=/tmp/ags-work \
          INCLUDE='\.conf$' \
          LISTEN= \
            python app/main.py --check | tee /tmp/ags-check.log
          grep -q 'GIT_REPO' /tmp/ags-check.log
          grep -q 'a.conf' /tmp/ags-check.log

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyflakes
      - run: python -m pyflakes app tests tools

  dockerfile:
    name: Lint the Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
