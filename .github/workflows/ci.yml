name: CI

# 单元测试与静态检查：任何分支的 push 和所有 PR 都会跑。
# 镜像的构建/发布见 docker.yml。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # 3.12 = 镜像用的版本
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试自带 fixture（本地裸仓库当远端），不需要装任何依赖，也不需要网络
      - name: 运行测试
        run: python -m unittest discover -s tests -t . -v

      - name: 校验环境变量配置的装配
        run: |
          set -uo pipefail

          python app/main.py --version

          # 缺少必填的 AGS_GIT_REPO 时应当以退出码 2 报错，而不是崩栈
          set +e
          python app/main.py --check
          code=$?
          set -e
          [ "$code" = 2 ] || { echo "::error::缺少 AGS_GIT_REPO 时应以退出码 2 失败，实际为 $code"; exit 1; }

          # 给全环境变量后 --check 应当成功跑通
          mkdir -p /tmp/ags-src
          printf 'a=1\n' > /tmp/ags-src/a.conf
          AGS_GIT_REPO=/tmp/remote.git \
          AGS_SOURCE=/tmp/ags-src \
          AGS_WORKDIR=/tmp/ags-work \
          AGS_INCLUDE='\.conf$' \
          AGS_LISTEN= \
            python app/main.py --check | tee /tmp/ags-check.log
          grep -q 'AGS_GIT_REPO' /tmp/ags-check.log
          grep -q 'a.conf' /tmp/ags-check.log

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyflakes
      - run: python -m pyflakes app tests

  dockerfile:
    name: 校验 Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
