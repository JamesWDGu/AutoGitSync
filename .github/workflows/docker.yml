name: Docker

# 触发规则：
#   push 到 main      -> 跑测试 + 镜像冒烟测试 + 发布 ghcr.io/jameswdgu/autogitsync:main、:latest、:sha-xxxxxxx
#   push 标签 v1.2.3  -> 额外发布 :1.2.3、:1.2（并更新 :latest 之外的语义化标签）
#   PR                -> 只跑测试 + 冒烟测试，不发布
#   手动运行          -> 可通过 publish 开关决定是否发布
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 是否推送镜像到镜像仓库
        type: boolean
        default: true

# 默认只给只读权限，需要写包的 job 单独声明 packages: write
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) 门禁：单元测试没过就不进入构建
  # ---------------------------------------------------------------------------
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 与镜像内的 Python 版本一致
      - run: python -m unittest discover -s tests -t . -v

  # ---------------------------------------------------------------------------
  # 2) 冒烟测试：真的把镜像跑起来验证行为（Dockerfile 改坏了这里会拦住）
  # ---------------------------------------------------------------------------
  smoke:
    name: 镜像冒烟测试
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建本地镜像
        run: docker build --build-arg AUTOGITSYNC_VERSION=ci -t autogitsync:ci .

      - name: 准备 fixture（裸仓库 + 待同步目录 + 环境变量文件）
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"
          mkdir -p "$FIXTURE/source/conf.d" "$FIXTURE/data"
          git init --bare --quiet --initial-branch=main "$FIXTURE/remote.git"
          printf 'listen 80;\n'     > "$FIXTURE/source/nginx.conf"
          printf 'a=1\n'            > "$FIXTURE/source/conf.d/app.ini"
          printf 'not synced\n'     > "$FIXTURE/source/notes.txt"

          # 配置全部走环境变量；--env-file 的值不做转义，正则可以照写
          cat > "$FIXTURE/env" <<'EOF'
          GIT_REPO=/fixture/remote.git
          GIT_BRANCH=main
          GIT_AUTHOR_NAME=AutoGitSync CI
          GIT_AUTHOR_EMAIL=ci@localhost
          SOURCE_DIR=/fixture/source
          REPO_DIR=/fixture/data/repo
          INCLUDE=\.(conf|ini)$
          INTERVAL=1h
          LISTEN=
          EOF
          echo "--- 生成的环境变量 ---"
          cat "$FIXTURE/env"

      - name: 冒烟测试：--version / --check / --once
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --version
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --check
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --once

          # 远端应该只有匹配 INCLUDE 的两个文件
          git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main
          git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main | grep -qx 'nginx.conf'
          git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main | grep -qx 'conf.d/app.ini'
          if git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main | grep -qx 'notes.txt'; then
            echo "::error::不匹配 INCLUDE 的文件不该被同步"; exit 1
          fi

          # 再跑一次：应当是无变更（幂等）
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --once | tee "$FIXTURE/once.log"
          grep -q '无变更' "$FIXTURE/once.log"

          # 端点关闭时健康检查应直接判定健康（退出码 0）
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --healthcheck

      - name: 冒烟测试：守护进程（默认端口 8080）+ 内置 HEALTHCHECK
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"

          # 不传任何命令行参数，只给环境变量（= README 里的 docker run 写法）
          docker run -d --name ags-default \
            --env-file "$FIXTURE/env" \
            -e LISTEN=0.0.0.0:8080 \
            -v "$FIXTURE:/fixture" \
            -p 18080:8080 \
            autogitsync:ci

          ready=no
          for _ in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:18080/healthz > /tmp/healthz-1.json 2>/dev/null; then ready=yes; break; fi
            sleep 2
          done
          cat /tmp/healthz-1.json 2>/dev/null || true
          echo
          [ "$ready" = yes ] || { echo "::error::健康端点在 60s 内没有就绪"; docker logs ags-default; exit 1; }
          grep -q '"status": "ok"' /tmp/healthz-1.json

          curl -fsS -m 3 http://127.0.0.1:18080/status; echo
          curl -fsS -m 3 -X POST http://127.0.0.1:18080/sync -o /dev/null -w 'POST /sync -> %{http_code}\n'

          echo "--- 等待镜像内置 HEALTHCHECK 转为 healthy ---"
          for _ in $(seq 1 24); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ags-default)" = healthy ] && break
            sleep 5
          done
          docker inspect -f '容器健康状态: {{.State.Health.Status}}' ags-default
          echo "--- 容器内健康检查命令的输出 ---"
          docker exec ags-default python /app/main.py --healthcheck || true
          [ "$(docker inspect -f '{{.State.Health.Status}}' ags-default)" = healthy ]

          docker stop ags-default >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' ags-default)
          echo "--- 容器日志 ---"; docker logs ags-default
          docker rm ags-default >/dev/null
          echo "退出码: $code"
          [ "$code" = 0 ]

      - name: 冒烟测试：自定义端口时健康检查也要跟对
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"

          # 端口不是 8080：LISTEN 是唯一来源，内置 HEALTHCHECK 必须仍然探测正确
          docker run -d --name ags-smoke \
            --env-file "$FIXTURE/env" \
            -e LISTEN=0.0.0.0:18081 \
            -v "$FIXTURE:/fixture" -p 18081:18081 \
            autogitsync:ci

          ready=no
          for _ in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:18081/healthz > /tmp/healthz-2.json 2>/dev/null; then ready=yes; break; fi
            sleep 2
          done
          cat /tmp/healthz-2.json 2>/dev/null || true
          echo
          [ "$ready" = yes ] || { echo "::error::健康端点在 60s 内没有就绪"; docker logs ags-smoke; exit 1; }
          grep -q '"status": "ok"' /tmp/healthz-2.json

          # 容器内健康检查命令本身必须成功（它读的是同一个 LISTEN）
          docker exec ags-smoke python /app/main.py --healthcheck

          docker stop ags-smoke >/dev/null     # 应触发 SIGTERM 优雅退出（退出码 0）
          code=$(docker inspect -f '{{.State.ExitCode}}' ags-smoke)
          echo "--- 容器日志 ---"; docker logs ags-smoke
          docker rm ags-smoke >/dev/null
          echo "退出码: $code"
          [ "$code" = 0 ]

      - name: 失败时输出诊断信息
        if: failure()
        run: |
          docker ps -a || true
          for name in ags-default ags-smoke; do
            echo "=== $name ==="
            docker inspect -f '{{json .State}}' "$name" 2>/dev/null | python3 -m json.tool 2>/dev/null || true
            docker logs "$name" 2>/dev/null || true
            docker exec "$name" env 2>/dev/null | sort || true
            docker exec "$name" python /app/main.py --healthcheck 2>&1 || true
          done

  # ---------------------------------------------------------------------------
  # 3) 发布：多架构镜像推送到 GHCR（amd64 + arm64）
  # ---------------------------------------------------------------------------
  publish:
    name: 构建并发布镜像
    needs: [test, smoke]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推送 ghcr.io 需要
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # 交叉构建 arm64
      - uses: docker/setup-buildx-action@v3

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=AutoGitSync
            org.opencontainers.image.description=把本地目录按原有路径定时同步到 Git 仓库（冲突以本地为准，本地缺失的文件从 git 删除）

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（linux/amd64 + linux/arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUTOGITSYNC_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 写入运行摘要
        run: |
          {
            echo "### 已发布镜像"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "拉取：\`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4) 打 v* 标签时自动创建 GitHub Release（发布说明里带上镜像地址）
  # ---------------------------------------------------------------------------
  release:
    name: 创建 GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 创建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: 生成发布说明并创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"                  # 例如 v1.2.1
          VERSION="${TAG#v}"
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          printf '%s\n' \
            '## 容器镜像' \
            '' \
            '```bash' \
            "docker pull ${IMAGE}:${VERSION}" \
            '' \
            'docker run -d --restart unless-stopped \' \
            '  -e GIT_REPO=https://github.com/your-name/my-configs.git \' \
            '  -e GIT_TOKEN=ghp_xxxxxxxx \' \
            '  -v /etc/nginx:/source:ro \' \
            "  ${IMAGE}:${VERSION}" \
            '```' \
            '' \
            "多架构：\`linux/amd64\` + \`linux/arm64\`。" \
            "\`:latest\` 跟随 \`main\` 分支，需要固定版本请用上面的标签。" \
            > /tmp/notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AutoGitSync ${VERSION}" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" \
              --title "AutoGitSync ${VERSION}" \
              --notes-file /tmp/notes.md \
              --generate-notes \
              --verify-tag
          fi

  # ---------------------------------------------------------------------------
  # 5) 可选：把同一份镜像同步到 Docker Hub
  #    启用方式：仓库 Settings -> Secrets and variables -> Actions
  #      Variable: DOCKERHUB_USERNAME
  #      Secret:   DOCKERHUB_TOKEN   （Docker Hub 的 Access Token，需要 Read & Write）
  #    没配置时这个 job 会被自动跳过。
  # ---------------------------------------------------------------------------
  dockerhub:
    name: 同步到 Docker Hub（可选）
    needs: publish
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read         # 从 ghcr 读取刚发布的镜像
    steps:
      - uses: docker/setup-buildx-action@v3      # imagetools 需要 buildx

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: 目标镜像名（Docker Hub 要求全小写）
        id: target
        run: |
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR（读取源镜像）
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 搬运多架构镜像（不重新构建）
        run: |
          set -euo pipefail
          for ref in ${{ steps.meta.outputs.tags }}; do
            tag="${ref##*:}"
            dest="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ steps.target.outputs.repo }}:${tag}"
            echo "==> $ref  ->  $dest"
            docker buildx imagetools create -t "$dest" "$ref"
          done
