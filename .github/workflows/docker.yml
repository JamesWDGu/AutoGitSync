name: Docker

# Triggers:
#   push to main     -> tests + image smoke test + publish ghcr.io/jameswdgu/autogitsync:main, :latest, :sha-xxxxxxx
#   push tag v1.2.3  -> publish :1.2.3 and :1.2 as well
#   pull request     -> tests + smoke test only, nothing is published
#   manual run       -> the publish switch decides whether images are pushed
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to the registry
        type: boolean
        default: true

# Read-only by default; jobs that need to write packages declare packages: write themselves
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Gate: nothing is built until the unit tests pass
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # same version as inside the image
      - run: python -m unittest discover -s tests -t . -v

  # ---------------------------------------------------------------------------
  # 2) Smoke test: actually run the image (this catches a broken Dockerfile)
  # ---------------------------------------------------------------------------
  smoke:
    name: Image smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image locally
        run: docker build --build-arg AUTOGITSYNC_VERSION=ci -t autogitsync:ci .

      - name: Prepare the fixture (bare repository + source directory + env file)
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"
          mkdir -p "$FIXTURE/source/conf.d" "$FIXTURE/data"
          git init --bare --quiet --initial-branch=main "$FIXTURE/remote.git"
          printf 'listen 80;\n'     > "$FIXTURE/source/nginx.conf"
          printf 'a=1\n'            > "$FIXTURE/source/conf.d/app.ini"
          printf 'not synced\n'     > "$FIXTURE/source/notes.txt"

          # All configuration is environment based; --env-file values are taken literally,
          # so the regex can be written as is
          cat > "$FIXTURE/env" <<'EOF'
          GIT_REPO=/fixture/remote.git
          GIT_BRANCH=main
          GIT_AUTHOR_NAME=AutoGitSync CI
          GIT_AUTHOR_EMAIL=ci@localhost
          SOURCE_DIR=/fixture/source
          REPO_DIR=/fixture/data/repo
          INCLUDE=\.(conf|ini)$
          INTERVAL=1h
          LISTEN=
          EOF
          echo "--- generated environment ---"
          cat "$FIXTURE/env"

      - name: "Smoke test: --version / --check / --once"
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --version
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --check
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --once

          # only the two files matching INCLUDE should be on the remote
          git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main
          git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main | grep -qx 'nginx.conf'
          git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main | grep -qx 'conf.d/app.ini'
          if git -c safe.directory='*' --git-dir="$FIXTURE/remote.git" ls-tree -r --name-only main | grep -qx 'notes.txt'; then
            echo "::error::a file that does not match INCLUDE must not be synced"; exit 1
          fi

          # second run: must be a no-op (idempotent)
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --once | tee "$FIXTURE/once.log"
          grep -q 'no changes' "$FIXTURE/once.log"

          # with the endpoint disabled the health check must report healthy (exit 0)
          docker run --rm --env-file "$FIXTURE/env" -v "$FIXTURE:/fixture" autogitsync:ci --healthcheck

      - name: "Smoke test: daemon on the default port 8080 + built-in HEALTHCHECK"
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"

          # no command line arguments, environment only (this is the README example)
          docker run -d --name ags-default \
            --env-file "$FIXTURE/env" \
            -e LISTEN=0.0.0.0:8080 \
            -v "$FIXTURE:/fixture" \
            -p 18080:8080 \
            autogitsync:ci

          ready=no
          for _ in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:18080/healthz > /tmp/healthz-1.json 2>/dev/null; then ready=yes; break; fi
            sleep 2
          done
          cat /tmp/healthz-1.json 2>/dev/null || true
          echo
          [ "$ready" = yes ] || { echo "::error::the health endpoint was not ready within 60s"; docker logs ags-default; exit 1; }
          grep -q '"status": "ok"' /tmp/healthz-1.json

          curl -fsS -m 3 http://127.0.0.1:18080/status; echo
          curl -fsS -m 3 -X POST http://127.0.0.1:18080/sync -o /dev/null -w 'POST /sync -> %{http_code}\n'

          echo "--- waiting for the built-in HEALTHCHECK to report healthy ---"
          for _ in $(seq 1 24); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ags-default)" = healthy ] && break
            sleep 5
          done
          docker inspect -f 'container health: {{.State.Health.Status}}' ags-default
          echo "--- output of the health check command inside the container ---"
          docker exec ags-default python /app/main.py --healthcheck || true
          [ "$(docker inspect -f '{{.State.Health.Status}}' ags-default)" = healthy ]

          docker stop ags-default >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' ags-default)
          echo "--- container logs ---"; docker logs ags-default
          docker rm ags-default >/dev/null
          echo "exit code: $code"
          [ "$code" = 0 ]

      - name: "Smoke test: the health check follows a custom port"
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/fixture"

          # not port 8080: LISTEN is the single source of truth, the built-in HEALTHCHECK
          # must still probe the right port
          docker run -d --name ags-smoke \
            --env-file "$FIXTURE/env" \
            -e LISTEN=0.0.0.0:18081 \
            -v "$FIXTURE:/fixture" -p 18081:18081 \
            autogitsync:ci

          ready=no
          for _ in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:18081/healthz > /tmp/healthz-2.json 2>/dev/null; then ready=yes; break; fi
            sleep 2
          done
          cat /tmp/healthz-2.json 2>/dev/null || true
          echo
          [ "$ready" = yes ] || { echo "::error::the health endpoint was not ready within 60s"; docker logs ags-smoke; exit 1; }
          grep -q '"status": "ok"' /tmp/healthz-2.json

          # the health check command inside the container must succeed (it reads the same LISTEN)
          docker exec ags-smoke python /app/main.py --healthcheck

          docker stop ags-smoke >/dev/null     # SIGTERM must shut it down gracefully (exit 0)
          code=$(docker inspect -f '{{.State.ExitCode}}' ags-smoke)
          echo "--- container logs ---"; docker logs ags-smoke
          docker rm ags-smoke >/dev/null
          echo "exit code: $code"
          [ "$code" = 0 ]

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          for name in ags-default ags-smoke; do
            echo "=== $name ==="
            docker inspect -f '{{json .State}}' "$name" 2>/dev/null | python3 -m json.tool 2>/dev/null || true
            docker logs "$name" 2>/dev/null || true
            docker exec "$name" env 2>/dev/null | sort || true
            docker exec "$name" python /app/main.py --healthcheck 2>&1 || true
          done

  # ---------------------------------------------------------------------------
  # 3) Publish: push the multi-arch image to GHCR (amd64 + arm64)
  # ---------------------------------------------------------------------------
  publish:
    name: Build and publish the image
    needs: [test, smoke]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # cross build arm64
      - uses: docker/setup-buildx-action@v3

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=AutoGitSync
            org.opencontainers.image.description=Sync a local directory to a Git repository on a schedule. Local wins on conflicts; files missing locally are deleted from Git.

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUTOGITSYNC_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Write the run summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull it with: \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4) Create a GitHub Release whenever a v* tag is pushed (notes include the image reference)
  # ---------------------------------------------------------------------------
  release:
    name: Create the GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create a release
    steps:
      - uses: actions/checkout@v4

      - name: Generate the notes and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"                  # e.g. v1.2.1
          VERSION="${TAG#v}"
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          printf '%s\n' \
            '## Container image' \
            '' \
            '```bash' \
            "docker pull ${IMAGE}:${VERSION}" \
            '' \
            'docker run -d --restart unless-stopped \' \
            '  -e GIT_REPO=https://github.com/your-name/my-configs.git \' \
            '  -e GIT_TOKEN=ghp_xxxxxxxx \' \
            '  -v /etc/nginx:/source:ro \' \
            "  ${IMAGE}:${VERSION}" \
            '```' \
            '' \
            "Multi-arch: \`linux/amd64\` + \`linux/arm64\`." \
            "Both \`main\` builds and stable releases update \`:latest\`; pin a version with the tag above." \
            > /tmp/notes.md

          # Annotated release tags carry the reviewed change summary.
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            printf '\n## Changes\n\n' >> /tmp/notes.md
            git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}" >> /tmp/notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AutoGitSync ${VERSION}" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" \
              --title "AutoGitSync ${VERSION}" \
              --notes-file /tmp/notes.md \
              --generate-notes \
              --verify-tag
          fi

  # ---------------------------------------------------------------------------
  # 5) Optional: mirror the same image to Docker Hub
  #    Enable it under Settings -> Secrets and variables -> Actions:
  #      Variable: DOCKERHUB_USERNAME
  #      Secret:   DOCKERHUB_TOKEN   (Docker Hub access token with Read & Write)
  #    Without them this job is skipped automatically.
  # ---------------------------------------------------------------------------
  dockerhub:
    name: Mirror to Docker Hub (optional)
    needs: publish
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read         # read the image that was just published to ghcr
    steps:
      - uses: docker/setup-buildx-action@v3      # imagetools needs buildx

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Target image name (Docker Hub requires lowercase)
        id: target
        run: |
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (source image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the multi-arch image over (no rebuild)
        run: |
          set -euo pipefail
          for ref in ${{ steps.meta.outputs.tags }}; do
            tag="${ref##*:}"
            dest="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ steps.target.outputs.repo }}:${tag}"
            echo "==> $ref  ->  $dest"
            docker buildx imagetools create -t "$dest" "$ref"
          done
