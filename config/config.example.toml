# ---------------------------------------------------------------------------
# AutoGitSync 配置示例：cp config/config.example.toml config/config.toml
#
# 任意字符串值都支持环境变量展开：${VAR} 或 ${VAR:-默认值}
# ---------------------------------------------------------------------------

[git]
# 仓库地址：支持 https（配 token）、file:// 或本地路径（无需 token）
url = "https://github.com/your-name/my-configs.git"
# 要推送到的分支；分支不存在时会自动创建
branch = "main"
# 访问令牌：强烈建议用环境变量注入，而不是写死在文件里
# GitHub 使用 fine-grained PAT（Contents: Read and write）
token = "${GIT_TOKEN}"
# 用作 HTTP Basic 用户名的部分：GitHub 用 x-access-token，GitLab 用 oauth2，
# Gitea / 自建服务通常任意非空字符串即可
username = "x-access-token"
# 提交者信息
author_name = "AutoGitSync"
author_email = "autogitsync@localhost"
# 提交信息模板，可用占位符：{count} {changed} {deleted} {time} {source} {host}
commit_message = "sync: {count} file(s) changed at {time}"
# 推送被拒（远端同时有更新）时的重试次数
push_retries = 3

[sync]
# 要同步的本地目录（容器内路径，通过 -v 挂载进来）
source = "/source"
# 只同步相对路径匹配该正则的文件（正则作用于形如 "app/settings.conf" 的相对路径）
include = '\.(conf|ya?ml|json|toml|ini|env|txt)$'
# 排除规则，留空表示不排除；注意 source 目录内的 .git 永远会被跳过
exclude = '(^|/)(\.git|node_modules|cache)/'
# 远端存在、本地已删除的文件是否也从 git 删除（这就是「镜像式同步」）
delete_missing = true
# 安全阀：本地一个匹配文件都没有时，是否允许把远端受管文件全部删掉
# 保持 false 可避免「目录挂载错了」导致仓库被清空
allow_empty = false
# git 工作副本所在目录（容器内，建议挂载持久化卷）
workdir = "/data/repo"
# 容器启动后是否立刻同步一次
run_on_start = true

# 同步周期：二选一
# 1) cron 表达式（5 字段：分 时 日 月 周，按容器 TZ 时区解释）
schedule = "*/5 * * * *"
# 2) 或固定间隔：30s / 5m / 2h / 1d
# interval = "5m"

[server]
# 健康/状态端点；设为 "" 可完全关闭
listen = "0.0.0.0:8080"
# 可选：调用 POST /sync 手动触发同步时需要携带 Authorization: Bearer <token>
api_token = ""

[log]
# DEBUG / INFO / WARNING / ERROR
level = "INFO"
