# Copy .env.example to .env and set your repository URL and write token.
# Put the files to sync in ./configs, then run: docker compose up -d
services:
  autogitsync:
    image: ghcr.io/jameswdgu/autogitsync:latest
    restart: unless-stopped
    init: true
    environment:
      GIT_REPO: ${GIT_REPO:?set GIT_REPO in .env or your shell}
      GIT_TOKEN: ${GIT_TOKEN:-}
      # Optional examples; omit them to use the documented defaults.
      # INCLUDE: '\.(conf|ya?ml)$'
      # SCHEDULE: '0 * * * *'
      # TZ: UTC
      # LOG_LANG: zh
    volumes:
      - ./configs:/source:ro
      - repo-data:/data
    # Only needed for host access to /status or POST /sync. Internal health checks
    # and `make trigger` need no published port. Set API_TOKEN before wider exposure.
    # ports:
    #   - "127.0.0.1:8080:8080"

volumes:
  repo-data:
