# AutoGitSync 部署示例：docker compose up -d
#
# 首次使用：
#   1. cp config/config.example.toml config/config.toml 并按需修改
#   2. cp .env.example .env 并填入 GIT_TOKEN
#   3. 修改下面 volumes 里的宿主机目录，指向你要同步的文件夹

services:
  autogitsync:
    build: .
    # 用 CI 构建好的多架构镜像时：注释掉上面的 build，改成你的仓库地址
    # image: ghcr.io/<owner>/<repo>:latest
    image: autogitsync:latest
    container_name: autogitsync
    restart: unless-stopped
    init: true

    environment:
      # 影响 cron 表达式的时区
      TZ: Asia/Shanghai
      # 供 config.toml 里的 ${GIT_TOKEN} 使用。
      # 如果你把 token 直接写进了 config.toml，删掉这一行即可。
      GIT_TOKEN: ${GIT_TOKEN:?请先在 .env 中设置 GIT_TOKEN，或删掉 docker-compose.yml 里的这一行}

    volumes:
      # 配置文件（只读）
      - ./config/config.toml:/config/config.toml:ro
      # git 工作副本与锁文件（持久化，可选但推荐：省去每次重新克隆）
      - ./data:/data
      # 要同步到 git 的本地目录：改成你的路径，只读挂载，服务永远不会改写它
      - ./example-source:/source:ro

    ports:
      # 只监听本机，避免把 POST /sync 的触发接口暴露到公网
      - "127.0.0.1:8080:8080"

    # 以宿主机用户身份运行，避免挂载目录出现 root 属主文件
    # user: "${UID:-1000}:${GID:-1000}"
