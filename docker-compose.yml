# AutoGitSync 部署示例：docker compose up -d
#
# 配置全部通过环境变量传入（没有配置文件，容器里也不挂任何配置）。
# 只有 GIT_REPO 是必填的；私有仓库再补一个 GIT_TOKEN。
# 变量可以直接写在这里，也可以放在同目录的 .env 里（compose 会自动读取）。

services:
  autogitsync:
    build: .
    # 用 CI 构建好的多架构镜像时：注释掉上面的 build，改成你的仓库地址
    # image: ghcr.io/<owner>/<repo>:latest
    image: autogitsync:latest
    container_name: autogitsync
    restart: unless-stopped
    init: true

    environment:
      # ---- 必填 ----
      GIT_REPO: ${GIT_REPO:?请设置 GIT_REPO，例如 https://github.com/you/my-configs.git}
      # 私有仓库需要；公开仓库可以删掉这一行
      GIT_TOKEN: ${GIT_TOKEN:-}

      # ---- 常用项（删掉即用默认值）----
      # 要同步的目录（容器内路径，由下面的 volumes 挂载进来）
      SOURCE_DIR: /source
      # 只同步匹配该正则的文件；不设置则全部同步。单引号可保留反斜杠
      INCLUDE: '\.(conf|ya?ml|json|toml|ini|env|txt)$'
      # 同步周期：cron 与固定间隔二选一，都不设则默认 5m
      SCHEDULE: "*/5 * * * *"
      # INTERVAL: 5m
      # 影响 cron 表达式按哪个时区解释
      TZ: Asia/Shanghai

    volumes:
      # 要同步到 git 的本地目录：改成你的路径，只读挂载，服务永远不会改写它
      - ./example-source:/source:ro
      # git 工作副本与锁文件（可选但推荐：省去每次重新克隆）
      - ./data:/data

    ports:
      # 只监听本机，避免把 POST /sync 触发接口暴露到公网
      - "127.0.0.1:8080:8080"

    # 以宿主机用户身份运行，避免挂载目录出现 root 属主文件
    # user: "${UID:-1000}:${GID:-1000}"
